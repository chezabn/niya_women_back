services:
  database:
    image: mysql:9.3.0
    container_name: mysql
    restart: unless-stopped
    env_file:
      - ../.env.prod
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "root",
          "-p$${MYSQL_ROOT_PASSWORD}"
        ]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: niyya_backend:prod
    container_name: backend
    restart: unless-stopped
    env_file:
      - ../.env.prod
    ports:
      - "127.0.0.1:5001:5001"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ../staticfiles:/app/staticfiles

volumes:
  database: